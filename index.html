<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse featured games and the lsite plus game library.">
  <meta name="theme-color" content="#25252b">
  <title>lsite plus</title>
  <link rel="stylesheet" href="menu.css">
  <script src="menu.js" defer></script>
</head>
<body id="top">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="lsite plus home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>lsite <em>plus</em></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#top">Home</a>
        <a href="#featured">Featured</a>
        <a href="#games">All Games</a>
        <a class="nav-ai" href="https://lsite-plus-ai.onrender.com/">lsite plus ai</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="featured" aria-labelledby="featured-title">
      <div class="section-heading">
        <h1 id="featured-title">Featured Games</h1>
      </div>
      <div class="carousel" id="featured-carousel">
        <div class="carousel-track" id="featured-track" role="region" aria-label="Featured games carousel" tabindex="0"></div>
        <div class="carousel-controls" role="group" aria-label="Featured game controls">
          <span id="slide-count" aria-live="polite">01 / 07</span>
          <div class="carousel-dots" id="carousel-dots" role="group" aria-label="Select a featured game"></div>
          <div class="carousel-arrows">
            <button class="arrow-button" id="previous" type="button" aria-label="Previous featured game" aria-controls="featured-track" aria-disabled="true"><span aria-hidden="true">&larr;</span></button>
            <button class="arrow-button" id="next" type="button" aria-label="Next featured game" aria-controls="featured-track"><span aria-hidden="true">&rarr;</span></button>
          </div>
        </div>
      </div>
    </section>

    <section id="games" aria-labelledby="games-title">
      <div class="section-heading">
        <h2 id="games-title">All Games</h2>
        <span class="game-count">18 games</span>
      </div>
      <div class="game-grid" id="game-grid"></div>
      <noscript><p><a href="js/index.html">Play Cookie Clicker</a></p></noscript>
    </section>
  </main>

  <template id="card-template">
    <span class="preview" aria-hidden="true">
      <span class="missing-icon"><span></span></span>
    </span>
    <span class="card-caption">
      <span class="card-copy">
        <span class="card-title"></span>
        <span class="card-description"></span>
      </span>
      <span class="card-action" aria-hidden="true"><span class="play-icon"></span>Play</span>
    </span>
  </template>

  <template id="featured-template">
    <div class="featured-card" role="group" aria-roledescription="slide">
      <div class="featured-copy">
        <h2 class="featured-title"></h2>
        <p class="featured-description"></p>
      </div>
      <div class="featured-preview" aria-hidden="true">
        <span class="preview-glass">
          <span class="missing-icon"><span></span></span>
          <span class="missing-icon icon-reflection"><span></span></span>
        </span>
      </div>
    </div>
  </template>

  <dialog id="game-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <h2 id="dialog-title">Placeholder Game</h2>
      <p>This game is coming soon.</p>
      <form method="dialog">
        <button class="dialog-button" autofocus>Back to games</button>
      </form>
    </div>
  </dialog>
</body>
</html>
