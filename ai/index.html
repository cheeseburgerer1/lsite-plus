<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25252b">
  <title>lsite plus ai</title>
  <style>
    @font-face {
      font-family: Roboto;
      src: url('/Roboto-Variable.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: Roboto, system-ui, sans-serif;
      color: #f7f2f5;
      background: #25252b;
      --accent: #ff7b87;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: radial-gradient(ellipse at 68% 0, #473441 0, transparent 68%), #25252b;
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    header { border-bottom: 1px solid #50424e; }
    .header-inner {
      max-width: 1320px;
      margin-inline: auto;
      padding: 14px clamp(18px, 5vw, 62px);
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.045em;
      white-space: nowrap;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(145deg, #ff9ba5, #f45e70);
      color: #2e1720;
      font-size: 23px;
      line-height: 1;
      box-shadow: inset 0 1px #ffffff75;
    }

    .brand-accent, h1 span { color: var(--accent); }
    .back {
      color: #e1d4df;
      padding: 9px 12px;
      border: 1px solid #6e5363;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .back:hover { background: #543d4e; }
    main {
      display: grid;
      place-items: center;
      padding: clamp(28px, 8vw, 96px) clamp(18px, 5vw, 62px);
    }

    .intro {
      width: min(100%, 980px);
      min-height: clamp(320px, 52vh, 540px);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      padding: 40px 24px;
      text-align: center;
      border: 1px solid #705565;
      border-radius: 22px;
      background: radial-gradient(ellipse at 80% 0, #a6596a49, transparent 64%),
        linear-gradient(145deg, #3c313e, #2b2630 63%, #3a2b39);
      box-shadow: inset 0 1px #ffc4d129, 0 22px 58px #15111866;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 104px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.06em;
    }

    .intro p { margin: 0; color: #e5d2dd; font-size: clamp(16px, 2.8vw, 20px); }
    @media (max-width: 370px) {
      .header-inner { gap: 8px; }
      .brand { font-size: 19px; gap: 7px; }
      .back { padding: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/" aria-label="lsite plus ai home"><span class="brand-mark" aria-hidden="true">+</span><span>lsite plus <span class="brand-accent">ai</span></span></a>
      <a class="back" href="https://lsite-plus.onrender.com/">← Back to lsite plus</a>
    </div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">lsite plus <span>ai</span></h1>
      <p>Coming soon.</p>
    </section>
  </main>
</body>
</html>
